<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-8</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="assets/img/8.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap");
    </style>
</head>

<body>

    <header class="animate__animated animate__fadeInDown">
        <a class="logo" style="color: brown; font-size: 20px;" href="#">DEV-8</a>
        <a style="color: black;" href="sobre.html">Sobre</a>
    </header>

    <main>
        <section class="login  ">
            <div class="img animate__animated animate__fadeInUp animate__delay-0.5s"></div>

            <div class="form  animate__animated animate__fadeInUp animate__delay-0.8s" id="formLogin">
                <h1 style="text-align: center">Login</h1>

                <p style="text-align: center; padding-bottom: 10px;">
                    Seja bem-vindo(a). Faça Login para se cadastrar a lista de espera
                    para o lançamento do GTA VI
                </p>

                <form action="php/login.php" method="post">

                    <div class="info">
                        <label for="Name"><img class="img1" src="assets/img/user.png" /></label>
                        <input class="input" type="text" name="nome" id="Name" placeholder="Digite o seu nome" />
                    </div>

                    <div class="info">
                        <label for="Email"><img class="img1" src="assets/img/email.png" /></label>
                        <input class="input" type="email" name="email" id="Email" placeholder="Exemplo@gmail.com" />
                    </div>

                    <div class="info">
                        <label for="Senha"><img class="img1" src="assets/img/senha.png" /></label>
                        <input class="input" minlength="8" maxlength="8" type="password" name="senha" id="Senha"
                            placeholder="Digite a sua senha" />
                    </div>
                    <p id="mensagemErro" style="color: red; text-align: center; display: none;">
                        Por favor, preencha todos os campos!
                    </p>
                    <button class="sub" type="submit">Login</button>
                </form>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
